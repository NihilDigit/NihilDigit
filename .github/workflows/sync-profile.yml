name: Sync Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  STATS_OPTIONS: username=NihilDigit&show_icons=true&include_all_commits=true&rank_icon=github&hide_border=true&hide=contribs&show=prs_merged,all_time_contribs&disable_animations=true
  LANGS_OPTIONS: username=NihilDigit&layout=compact&langs_count=6&size_weight=0.5&count_weight=0.5&hide_border=true&card_width=320&disable_animations=true

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: python scripts/update-projects.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: python scripts/update-arxiv.py

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "sync: update profile data"
          file_pattern: README.md

  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # fail_on_error keeps yesterday's cards on the output branch when the
      # API is rate limited, instead of publishing the error card
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&theme=light_github
          path: cards/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: ${{ env.STATS_OPTIONS }}&theme=dark_github
          path: cards/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTIONS }}&theme=light_github
          path: cards/top-langs-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: ${{ env.LANGS_OPTIONS }}&theme=dark_github
          path: cards/top-langs-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      # The cards fall back to Ubuntu when Segoe UI is missing; the runner
      # image ships Chrome but not this font
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libavif-bin fonts-ubuntu

      - run: bash scripts/render-cards.sh cards

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
