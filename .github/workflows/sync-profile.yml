name: Sync Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.plan.outputs.repos }}
      cards: ${{ steps.plan.outputs.cards }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: python scripts/update-projects.py plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One job per card: the action is a composite that cannot loop over the
  # pinned repos, whose count and names change with the profile
  cards:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        card: ${{ fromJSON(needs.plan.outputs.cards) }}
    name: cards (${{ matrix.card.name }})
    steps:
      # fail_on_error keeps yesterday's cards on the output branch when the
      # API is rate limited, instead of publishing the error card
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: ${{ matrix.card.card }}
          options: ${{ matrix.card.light }}
          path: cards/${{ matrix.card.name }}-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: ${{ matrix.card.card }}
          options: ${{ matrix.card.dark }}
          path: cards/${{ matrix.card.name }}-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.card.name }}
          path: cards/

  publish:
    needs: cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: card-*
          merge-multiple: true
          path: cards

      # The runner image ships Chrome but neither Ubuntu, which the cards fall
      # back to without Segoe UI, nor a CJK font for repo descriptions
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libavif-bin fonts-ubuntu fonts-noto-cjk

      - run: bash scripts/render-cards.sh cards

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  readme:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: python scripts/update-projects.py readme
        env:
          PINNED_REPOS: ${{ needs.plan.outputs.repos }}

      - run: python scripts/update-arxiv.py

      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "sync: update profile data"
          file_pattern: README.md
