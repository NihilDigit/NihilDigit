name: Generate Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Snake ---
      - uses: Platane/snk@v3
        with:
          github_user_name: NihilDigit
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Profile Summary Cards ---
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: NihilDigit
          AUTO_PUSH: false

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-cards
          build_dir: profile-summary-card-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- README sync ---
      - run: python scripts/update-projects.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: python scripts/update-arxiv.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sync: update profile data"
